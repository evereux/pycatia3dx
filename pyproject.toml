[project]
name = "pycatia3dx"
version = 0.1
dependencies = [
    "pywin32 == 312",
]
[dependency-groups]
dev = [
    "mypy==1.19.1",
    "pytest==9.0.2",
]
[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"